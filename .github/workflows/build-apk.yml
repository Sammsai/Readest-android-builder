name: Build Android APK (Self-hosted)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '原作者分支或 tag (默认 main)'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Upstream Readest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: readest/readest
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Inject Self-hosted Backend Config & Patches
        run: |
          # 1. 注入自建后端环境变量
          cat << 'EOF' > apps/readest-app/.env.production
          NEXT_PUBLIC_APP_PLATFORM=tauri
          NEXT_PUBLIC_API_BASE_URL=https://book.zcee.cc
          NEXT_PUBLIC_SUPABASE_URL=https://book.zcee.cc
          NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNjAwMDAwMDAwLCJleHAiOjIwMDAwMDAwMDB9.pBBgl_ihwheflqYhxBn_19BiB64zUKe2T_jAQCVsi0c
          NEXT_PUBLIC_SELF_HOSTED=true
          NEXT_PUBLIC_OBJECT_STORAGE_TYPE=s3
          NEXT_PUBLIC_STORAGE_FIXED_QUOTA=10737418240
          NEXT_PUBLIC_TRANSLATION_FIXED_QUOTA=50000
          EOF

          cp apps/readest-app/.env.production apps/readest-app/.env.local
          cp apps/readest-app/.env.production apps/readest-app/.env.tauri.local

          # 2. 补丁：适配 MinIO/S3 存储哈希方案
          sed -i "s/return 'r2'/return process.env['NEXT_PUBLIC_OBJECT_STORAGE_TYPE'] || 'r2'/g" apps/readest-app/src/utils/storage.ts

          # 3. 补丁：适配自建端无限/固定额度
          sed -i "s/fixedQuota: 0/fixedQuota: Number(process.env['NEXT_PUBLIC_STORAGE_FIXED_QUOTA'] || 0)/g" apps/readest-app/src/utils/access.ts

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy Vendor Assets (PDF.js & SimpleCC WASM)
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Build Web Assets (Next.js Static Export)
        run: pnpm --filter @readest/readest-app build

      - name: Init Tauri Android Project & Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png

          # 仅还原 gen/android 下官方仓库跟踪的文件，不覆盖应用源码
          git checkout -- src-tauri/gen/android

          # 必须赋予 gradlew 可执行权限，否则 Tauri 无法调用 Gradle (BeforeSpawn 错误)
          chmod +x src-tauri/gen/android/gradlew

          # 还原永久签名证书
          base64 -d <<< "$KEYSTORE_BASE64" > "$RUNNER_TEMP/release.jks"

          # 写入 Gradle 签名配置
          cat << EOF > src-tauri/gen/android/keystore.properties
          password=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cd apps/readest-app
          pnpm tauri android build --apk --target aarch64

      - name: Verify & Final Sign APK with apksigner
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK_PATH=$(find apps/readest-app/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          echo "Using apksigner from: $BUILD_TOOLS_DIR"

          # 使用固定的永久密钥对 APK 进行加固签名 (v1 + v2 + v3)
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK_PATH"

          # 校验签名状态
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"

          # 读取版本号并格式化输出文件名
          VERSION=$(node -p "require('./apps/readest-app/package.json').version")
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV
          
          mkdir -p output
          OUTPUT_APK="output/Readest-${VERSION}-arm64-v8a-selfhosted.apk"
          cp "$APK_PATH" "$OUTPUT_APK"
          echo "OUTPUT_APK=$OUTPUT_APK" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: readest-selfhosted-arm64-v8a
          path: output/*.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Readest Android ${{ env.APP_VERSION }} (Self-hosted)
          body: |
            ## Readest Android 自建后端专用客户端
            
            - **版本**: ${{ env.APP_VERSION }}
            - **后端地址**: `https://book.zcee.cc`
            - **架构**: `arm64-v8a`
            - **签名**: 使用固定密钥签署，支持覆盖升级。
          files: ${{ env.OUTPUT_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
